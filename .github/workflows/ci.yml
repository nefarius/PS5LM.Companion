name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          # Pinned: the aka.ms link for 10.0.403 points at a storage host that answers 409.
          # Un-pin (use global-json-file: global.json) once newer SDKs download again.
          dotnet-version: 10.0.402

      - name: Restore tools
        run: dotnet tool restore

      - name: Version
        id: version
        run: echo "value=$(dotnet minver --tag-prefix v)" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore PS5LM.Companion.slnx

      - name: Build
        env:
          MINVERVERSIONOVERRIDE: ${{ steps.version.outputs.value }}
        run: dotnet build PS5LM.Companion.slnx --no-restore -c Release

      - name: Test
        env:
          MINVERVERSIONOVERRIDE: ${{ steps.version.outputs.value }}
        run: dotnet test PS5LM.Companion.slnx --no-build -c Release --verbosity normal

      - name: Vulnerability scan
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r proj; do
            out="vuln-$(basename "$proj" .csproj).txt"
            dotnet list "$proj" package --vulnerable --include-transitive >"$out" 2>&1
            cat "$out"
            if grep -q "has the following vulnerable packages" "$out"; then
              echo "::error::Vulnerable packages in $proj"
              fail=1
            fi
          done < <(find src tests -name '*.csproj' -print | sort)
          exit "$fail"

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build image
        run: docker build -f docker/Dockerfile --build-arg MINVERVERSIONOVERRIDE="${{ needs.build-and-test.outputs.version }}" -t ps5lm-companion:ci .

      - name: Check image version
        run: |
          set -euo pipefail
          expected="${{ needs.build-and-test.outputs.version }}"
          label="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' ps5lm-companion:ci)"
          test "$label" = "$expected"
          id="$(docker create ps5lm-companion:ci)"
          trap 'docker rm "$id" >/dev/null' EXIT
          docker cp "$id:/app/PS5LM.Companion.App.dll" "$RUNNER_TEMP/PS5LM.Companion.App.dll"
          grep -a -F -q "$expected" "$RUNNER_TEMP/PS5LM.Companion.App.dll"
